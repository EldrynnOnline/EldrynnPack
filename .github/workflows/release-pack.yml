name: Build & Release Resource Pack (commit SHA)

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create resource pack zip
        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA::7}"
          ZIP_NAME="resourcepack-${SHORT_SHA}.zip"

          zip -r "$ZIP_NAME" . \
            -x ".git/*" \
            -x ".github/*" \
            -x ".gitignore" \
            -x ".gitattributes" \
            -x "README*" \
            -x "LICENSE*" \
            -x "**/.DS_Store" \
            -x "**/Thumbs.db"

          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          echo "TAG=commit-${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "TITLE=Commit ${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TITLE }}
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
          prerelease: false
          fail_on_unmatched_files: true
