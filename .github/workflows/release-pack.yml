name: Build & Publish Latest Resource Pack (stable link)

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create resource pack zip (stable filename)
        run: |
          set -euo pipefail

          ZIP_NAME="EldrynnPack.zip"

          # Zip everything except repo/CI metadata and common non-pack files.
          zip -r "$ZIP_NAME" . \
            -x ".git/*" \
            -x ".github/*" \
            -x ".gitignore" \
            -x ".gitattributes" \
            -x "README*" \
            -x "LICENSE*" \
            -x "**/.DS_Store" \
            -x "**/Thumbs.db"

          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Create or update the fixed release (tag: latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="latest"
          TITLE="Latest dev build"
          NOTES="Auto-updated from dev.\n\nCommit: ${GITHUB_SHA}"

          # Create the release if it doesn't exist; otherwise update its title/notes.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes "$NOTES"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "dev" \
              --title "$TITLE" \
              --notes "$NOTES"
          fi

      - name: Upload asset (replace in-place)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "latest" "${{ env.ZIP_NAME }}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
